name: Validate CSVs and publish to Kaggle

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: CSV validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate all CSV files
        run: python tests/validate_csvs.py

  publish:
    name: Push new dataset version to Kaggle
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      DATASET_DIR: ushirika_statistics_data/kaggle_dataset
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changes in kaggle_dataset
        id: diff
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git rev-parse HEAD^ >/dev/null 2>&1 \
               && git diff --quiet HEAD^ HEAD -- "$DATASET_DIR"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Refuse placeholder metadata
        if: steps.diff.outputs.changed == 'true'
        run: |
          if grep -q "YOUR_KAGGLE_USERNAME" "$DATASET_DIR/dataset-metadata.json"; then
            echo "dataset-metadata.json still contains the placeholder username."
            echo "Set your Kaggle username in the 'id' field before publishing."
            exit 1
          fi

      - uses: actions/setup-python@v5
        if: steps.diff.outputs.changed == 'true'
        with:
          python-version: "3.12"

      - name: Install Kaggle CLI
        if: steps.diff.outputs.changed == 'true'
        run: pip install kaggle

      - name: Configure Kaggle credentials
        if: steps.diff.outputs.changed == 'true'
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          if [ -z "$KAGGLE_USERNAME" ] || [ -z "$KAGGLE_KEY" ]; then
            echo "KAGGLE_USERNAME / KAGGLE_KEY secrets are missing or empty."
            exit 1
          fi
          mkdir -p ~/.kaggle
          printf '{"username":"%s","key":"%s"}' "$KAGGLE_USERNAME" "$KAGGLE_KEY" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json

      - name: Publish new dataset version
        if: steps.diff.outputs.changed == 'true'
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          kaggle datasets version \
            -p "$DATASET_DIR" \
            -m "Auto-update from commit $SHORT_SHA"

      - name: No dataset changes, skipping publish
        if: steps.diff.outputs.changed == 'false'
        run: echo "kaggle_dataset/ unchanged in this push; nothing to publish."
